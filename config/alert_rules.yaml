alerts:
  - name: High Latency - API responses taking too long
    severity: warning
    condition: "P95 latency > 2000ms for 5 consecutive minutes"
    type: symptom-based
    owner: Platform Team
    runbook: docs/alerts.md#alert-1
  - name: High Error Rate - Requests failing
    severity: critical
    condition: "Error rate > 2% for 5 consecutive minutes"
    type: symptom-based
    owner: Platform Team
    runbook: docs/alerts.md#alert-2
  - name: Low Quality Score - Answers below threshold
    severity: warning
    condition: "Mean quality score < 0.75 for 10 consecutive minutes"
    type: symptom-based
    owner: AI Team
    runbook: docs/alerts.md#alert-3
